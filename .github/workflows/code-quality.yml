name: 代码质量

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # 每周一凌晨 2 点运行
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  format-check:
    name: 代码格式检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: 安装 uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: 安装依赖
      run: |
        uv sync --extra dev
    
    - name: 检查代码格式
      run: |
        uv run black --check --diff src/ tests/
    
    - name: 自动格式化建议
      if: failure()
      run: |
        echo "💡 代码格式不符合 Black 标准"
        echo "运行以下命令修复："
        echo "  uv run black src/ tests/"

  lint:
    name: Linting 检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: 安装 uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: 安装依赖
      run: |
        uv sync --extra dev
    
    - name: Ruff 检查
      run: |
        uv run ruff check src/ tests/ --output-format=full

  type-check:
    name: 类型检查
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: 安装 uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: 安装依赖
      run: |
        uv sync --extra dev
    
    - name: MyPy 类型检查
      run: |
        uv run mypy src/ --html-report mypy-report
      continue-on-error: true
    
    - name: 上传 MyPy 报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mypy-report
        path: mypy-report/
        retention-days: 7
      continue-on-error: true

  coverage-report:
    name: 测试覆盖率报告
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置 Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    
    - name: 安装 uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: 安装依赖
      run: |
        uv sync --extra dev
    
    - name: 生成覆盖率报告
      run: |
        uv run pytest --cov=src --cov-report=html --cov-report=term
    
    - name: 上传覆盖率报告
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7
    
    - name: 生成覆盖率徽章数据
      run: |
        COVERAGE=$(uv run pytest --cov=src --cov-report=term | grep TOTAL | awk '{print $4}' | sed 's/%//')
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        echo "📊 测试覆盖率: $COVERAGE%"

